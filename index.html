<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yusuf | Running</title>
    <meta name="description" content="Yusuf'un koşu antrenmanları ve Strava aktiviteleri.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0d0d0d;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        .container {
            width: min(100% - 32px, 700px);
            margin: 0 auto;
            padding: 48px 0;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 32px;
        }

        .subtitle {
            color: #999999;
            margin-bottom: 18px;
        }

        .accent {
            width: 46px;
            height: 3px;
            margin: 0 auto 32px;
            background: #fc4c02;
            border-radius: 999px;
        }

        .section-title {
            margin: 0 0 18px;
            font-size: 20px;
        }

        .strava {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .strava iframe {
            max-width: 100%;
            border-radius: 12px;
        }

        footer {
            margin-top: 32px;
            color: #666666;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Yusuf</h1>

        <div class="subtitle">
            Running • Training • Progress
        </div>

        <div class="accent"></div>

        <h2 class="section-title">Son Aktivitelerim</h2>

        <div class="strava">
            <iframe
                height="454"
                width="300"
                frameborder="0"
                allowtransparency="true"
                scrolling="no"
                src="https://www.strava.com/athletes/137189278/latest-rides/e794d3646c190b462019147d0c195e557f34fd2b">
            </iframe>
        </div>

        <footer>
            Aktiviteler Strava üzerinden gösterilir.
        </footer>

    </div>

</body>
</html>
