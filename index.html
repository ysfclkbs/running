<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yusuf Çelikbaş | Running</title>

    <meta name="description"
          content="Yusuf Çelikbaş koşu antrenmanları, kişisel dereceleri ve Strava aktiviteleri.">

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            color-scheme: dark;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #1a1a1a 0%,
                    #0d0d0d 45%,
                    #070707 100%
                );

            color: white;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
        }


        /* ANA SAYFA */

        .page {
            width: min(100% - 32px, 1320px);
            margin: 0 auto;
            padding: 58px 0 50px;
        }


        /* =========================
           PROFİL
        ========================== */

        .hero {
            text-align: center;
            margin-bottom: 38px;
        }

        .profile-column {
            min-width: 0;
        }

        .profile-column .hero {
            margin-bottom: 0;
        }


        .profile-photo-wrapper {
            width: 180px;
            height: 180px;

            margin: 0 auto 20px;

            padding: 4px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #fc4c02,
                    #ff8a50
                );

            box-shadow:
                0 0 35px
                rgba(252, 76, 2, 0.25);
        }


        .profile-photo {
            width: 100%;
            height: 100%;

            display: block;

            border-radius: 50%;

            object-fit: cover;

            object-position: 50% 25%;

            border: 4px solid #111;
        }


        .runner-label {
            color: #fc4c02;

            font-size: 12px;

            font-weight: 800;

            letter-spacing: 3px;

            margin-bottom: 9px;
        }


        h1 {
            margin: 0;

            font-size:
                clamp(
                    34px,
                    6vw,
                    52px
                );

            letter-spacing: -1.5px;
        }


        .subtitle {
            margin-top: 10px;

            color: #aaa;

            font-size: 16px;
        }


        .accent {
            width: 52px;
            height: 4px;

            background: #fc4c02;

            margin: 24px auto;

            border-radius: 20px;
        }


        /* =========================
           PB KARTLARI
        ========================== */

        .pb-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 170px));

            justify-content: center;

            gap: 14px;

            margin-top: 26px;
        }


        .pb-card {
            position: relative;

            padding: 17px 12px;

            border-radius: 16px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.05
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );

            box-shadow:
                0 12px 30px
                rgba(0, 0, 0, 0.25);
        }


        .pb-distance {
            color: #aaa;

            font-size: 12px;

            font-weight: 800;

            letter-spacing: 1.5px;
        }


        .pb-time {
            margin-top: 5px;

            font-size: 27px;

            font-weight: 800;

            letter-spacing: -0.8px;
        }


        .pb-label {
            margin-top: 4px;

            color: #fc4c02;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 1px;
        }


        /* =========================
           ANA 3 SÜTUNLU DÜZEN
        ========================== */

        .dashboard {
            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                354px
                minmax(0, 1fr);

            gap: 22px;

            align-items: start;
        }


        /* =========================
           STRAVA KARTLARI
        ========================== */

        .card {
            background:
                rgba(
                    255,
                    255,
                    255,
                    0.045
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.09
                );

            border-radius: 20px;

            padding: 20px;

            box-shadow:
                0 16px 50px
                rgba(0, 0, 0, 0.25);
        }


        .card-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 16px;
        }


        .card-title {
            margin: 0;

            font-size: 18px;

            font-weight: 750;
        }


        .strava-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #fc4c02;

            box-shadow:
                0 0 12px
                rgba(252, 76, 2, 0.65);
        }


        /* =========================
           STRAVA IFRAME
        ========================== */

        .strava-frame {
            width: 100%;

            overflow: hidden;

            border-radius: 12px;

            background: white;
        }


        .strava-frame iframe {
            display: block;

            width: 100%;

            max-width: none;

            border: 0;
        }


        .latest iframe {
            height: 454px;
        }


        .summary iframe {
            height: 160px;
        }


        /* =========================
           FOOTER
        ========================== */

        footer {
            text-align: center;

            margin-top: 38px;

            color: #666;

            font-size: 12px;
        }


        footer span {
            color: #fc4c02;
            font-weight: 700;
        }


        /* =========================
           MOBİL
        ========================== */

        @media (max-width: 700px) {

            .page {
                width: min(100% - 24px, 520px);

                padding-top: 35px;
            }


            .profile-photo-wrapper {
                width: 145px;
                height: 145px;
            }


            .hero {
                margin-bottom: 30px;
            }


            .profile-column .hero {
                margin-bottom: 0;
            }


            .pb-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                max-width: 360px;

                margin-left: auto;
                margin-right: auto;
            }


            .pb-time {
                font-size: 24px;
            }


            .dashboard {
                grid-template-columns: 1fr;

                gap: 18px;
            }


            .card {
                padding: 14px;

                border-radius: 16px;
            }


            .profile-column {
                order: 1;

                margin-bottom: 12px;
            }


            .weekly {
                order: 2;
            }


            .latest {
                order: 3;
            }

        }

    </style>

</head>


<body>


<div class="page">


    <main class="dashboard">


        <!-- =========================
             SOL
             SON AKTİVİTELER
        ========================== -->

        <section class="card latest">


            <div class="card-header">

                <h2 class="card-title">
                    Son Aktiviteler
                </h2>

                <span class="strava-dot"></span>

            </div>


            <div class="strava-frame">

                <iframe
                    height="454"
                    width="300"
                    frameborder="0"
                    allowtransparency="true"
                    scrolling="no"
                    src="https://www.strava.com/athletes/137189278/latest-rides/e794d3646c190b462019147d0c195e557f34fd2b">
                </iframe>

            </div>


        </section>



        <!-- =========================
             ORTA
             PROFİL + PB
        ========================== -->

        <div class="profile-column">


            <header class="hero">


                <div class="profile-photo-wrapper">

                    <img
                        src="profile.jpg"
                        alt="Yusuf Çelikbaş"
                        class="profile-photo">

                </div>


                <div class="runner-label">

                    RUNNING

                </div>


                <h1>

                    Yusuf Çelikbaş

                </h1>


                <div class="subtitle">

                    Training • Racing • Progress

                </div>


                <div class="accent"></div>



                <!-- =========================
                     PB
                ========================== -->

                <div class="pb-grid">


                    <div class="pb-card">

                        <div class="pb-distance">

                            10K

                        </div>


                        <div class="pb-time">

                            57:40

                        </div>


                        <div class="pb-label">

                            PERSONAL BEST

                        </div>

                    </div>



                    <div class="pb-card">

                        <div class="pb-distance">

                            21K

                        </div>


                        <div class="pb-time">

                            2:25:36

                        </div>


                        <div class="pb-label">

                            PERSONAL BEST

                        </div>

                    </div>


                </div>


            </header>


        </div>



        <!-- =========================
             SAĞ
             HAFTALIK ÖZET
        ========================== -->

        <section class="card weekly">


            <div class="card-header">

                <h2 class="card-title">

                    Haftalık Özet

                </h2>

                <span class="strava-dot"></span>

            </div>


            <div class="strava-frame summary">

                <iframe
                    height="160"
                    width="300"
                    frameborder="0"
                    allowtransparency="true"
                    scrolling="no"
                    src="https://www.strava.com/athletes/137189278/activity-summary/e794d3646c190b462019147d0c195e557f34fd2b">
                </iframe>

            </div>


        </section>


    </main>



    <footer>

        Aktivite verileri
        <span>Strava</span>
        üzerinden gösterilir.

    </footer>


</div>


</body>
</html>
